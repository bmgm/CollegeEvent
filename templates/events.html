{% extends "base.html" %}
{% block content %}
<h2>Events</h2>
<div class="events-grid">
  {% for ev in events %}
  <div class="card">
    <img src="{{ url_for('serve_resource', filename=ev.image.replace('resources/', '')) }}" alt="{{ ev.event_name }}" style="width:100%; height:160px; object-fit:cover; border-radius:6px; margin-bottom:0.6rem;">
    <h3>{{ ev.event_name }}</h3>
    <p><strong>Date:</strong> {{ ev.date }}</p>
    <p><strong>Time:</strong> {{ ev.time }}</p>
    <p><strong>Venue:</strong> {{ ev.venue }}</p>
    <p>{{ ev.description[:120] }}...</p>
    <a href="{{ url_for('event_details', event_id=ev.event_id) }}">View Details</a>
  </div>
  {% endfor %}
</div>
{% endblock %}
